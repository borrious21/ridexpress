<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Profile</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans ">

<div class="container items-center mt-10 mt-10 mx-auto">

  <!-- Search Bar -->
<div class="max-w-5xl mx-auto mt-10">
  <div class="bg-green-900 p-4 rounded-md">
    <input type="text" placeholder="Search..." class="w-full p-2 rounded-md outline-none" />
  </div>
</div>


  <!-- Profile Section -->
  <div class="max-w-5xl mx-auto p-4">
    <div class="bg-white shadow-md rounded-lg p-4 flex items-center space-x-4">
      <img src="https://randomuser.me/api/portraits/men/76.jpg" class="w-16 h-16 rounded-full object-cover" />
      <div>
        <h2 class="text-lg font-semibold">Rohit Shah</h2>
        <p class="text-sm text-gray-600">Admin</p>
        <p class="text-sm text-gray-600">Ithari, Nepal</p>
      </div>
    </div>

    <!-- Personal Information -->
    <div class="bg-white shadow-md rounded-lg p-6 mt-6 relative">
      <h3 class="text-lg font-bold mb-4">Personal Information</h3>
      <button class="absolute top-6 right-6 bg-orange-500 hover:bg-orange-600 text-white px-4 py-1 text-sm rounded-md">Edit</button>
      <div class="grid grid-cols-1 md:grid-cols-3 gap-4 text-sm text-gray-700">
        <div>
          <p class="font-semibold">First Name:</p>
          <p>Rohit</p>
        </div>
        <div>
          <p class="font-semibold">Last Name:</p>
          <p>Shah</p>
        </div>
        <div>
          <p class="font-semibold">Date of Birth:</p>
          <p>12-12-2002</p>
        </div>
        <div>
          <p class="font-semibold">Email:</p>
          <p>shahrohit@gmail.com</p>
        </div>
        <div>
          <p class="font-semibold">Phone Number:</p>
          <p>+9834576997</p>
        </div>
        <div>
          <p class="font-semibold">User Role:</p>
          <p>Admin</p>
        </div>
      </div>
    </div>

    <!-- Address Information -->
    <div class="bg-white shadow-md rounded-lg p-6 mt-6">
      <h3 class="text-lg font-bold mb-4">Address</h3>
      <div class="grid grid-cols-1 md:grid-cols-3 gap-4 text-sm text-gray-700">
        <div>
          <p class="font-semibold">Country:</p>
          <p>Nepal</p>
        </div>
        <div>
          <p class="font-semibold">City:</p>
          <p>Itahari</p>
        </div>
        <div>
          <p class="font-semibold">Postal Code:</p>
          <p>EST 014</p>
        </div>
      </div>
    </div>

  </div>
</div>
</body>
</html>
